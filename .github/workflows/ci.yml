name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run validation tests
        run: |
          cd skills/ui-consistency/tests
          python3 run_all_tests.py

      - name: Check install script
        run: |
          chmod +x install.sh
          # Install to default location so tests can find extension files
          ./install.sh "$HOME/.gsd/agent/extensions/ui-consistency"
          test -f "$HOME/.gsd/agent/extensions/ui-consistency/package.json"
          test -f "$HOME/.gsd/agent/extensions/ui-consistency/extension-manifest.json"
          test -f "$HOME/.gsd/agent/extensions/ui-consistency/index.ts"
          test ! -f "$HOME/.gsd/agent/extensions/ui-consistency/install.sh"
